[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quilrai-llm-resilient-router"
version = "0.1.0"
description = "SQLite-backed token limiter and resilient LLM model router"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "tiktoken>=0.8,<1",
    "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools]
py-modules = ["router"]
