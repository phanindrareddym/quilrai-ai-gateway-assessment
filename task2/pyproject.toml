[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quilrai-mcp-task2"
version = "0.1.0"
description = "Role-aware HTTP JSON-RPC MCP gateway assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools]
py-modules = ["gateway", "mock_server"]
