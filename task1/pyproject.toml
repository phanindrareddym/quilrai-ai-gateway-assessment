[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quilrai-mcp-task1"
version = "0.1.0"
description = "Strictly validated stdio MCP server assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26,<2",
    "pydantic>=2.11,<3",
]

[tool.setuptools]
py-modules = ["server"]
